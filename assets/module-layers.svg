</style><defs><marker id="mls-call" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah call" d="M0,0 L10,5 L0,10 z"/></marker><marker id="mls-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah event" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1130" height="760"/><text class="lg" x="30" y="34" text-anchor="start">Inside one module: the sales module as the example. Every module has the same folders (ADR-015).</text><line class="e call" x1="30" y1="58" x2="64" y2="58" marker-end="url(#mls-call)"/><text class="lg2" x="74" y="62" text-anchor="start">calls</text><line class="e event" x1="130" y1="58" x2="164" y2="58" marker-end="url(#mls-event)"/><text class="lg2" x="174" y="62" text-anchor="start">publishes an event</text><line class="e uses" x1="330" y1="58" x2="364" y2="58"/><text class="lg2" x="374" y="62" text-anchor="start">uses</text><rect class="frame" x="300" y="92" width="520" height="560" rx="14"/><text class="ft" x="316" y="116" text-anchor="start">SALES MODULE</text><text class="fs" x="804" y="116" text-anchor="end">com.devcity.retailos.sales</text><g class="ly pub"><rect class="" x="318" y="132" width="170" height="74" rx="10"/><text class="lt" x="330" y="153" text-anchor="start">SalesApi.java</text><line class="sep" x1="318" y1="163" x2="488" y2="163"/><text class="lx" x="330" y="181" text-anchor="start">the only way in;</text><text class="lx" x="330" y="197" text-anchor="start">SaleService implements it</text></g><g class="ly pub"><rect class="" x="500" y="132" width="140" height="74" rx="10"/><text class="lt" x="512" y="153" text-anchor="start">spi/</text><line class="sep" x1="500" y1="163" x2="640" y2="163"/><text class="lx" x="512" y="181" text-anchor="start">SaleLineValidator …</text><text class="lx" x="512" y="197" text-anchor="start">extensions implement</text></g><g class="ly pub"><rect class="" x="652" y="132" width="152" height="74" rx="10"/><text class="lt" x="664" y="153" text-anchor="start">events/</text><line class="sep" x1="652" y1="163" x2="804" y2="163"/><text class="lx" x="664" y="181" text-anchor="start">SaleCompleted</text><text class="lx" x="664" y="197" text-anchor="start">SaleReturned</text></g><text class="pl" x="318" y="126" text-anchor="start">PUBLIC: other modules may use these</text><rect class="inner" x="314" y="236" width="492" height="400" rx="12"/><text class="it" x="328" y="256" text-anchor="start">internal/  ·  NOT visible to other modules (the boundary test fails)</text><g class="ly web"><rect class="" x="336" y="268" width="300" height="92" rx="10"/><text class="lt" x="350" y="290" text-anchor="start">Controller</text><text class="lf" x="622" y="290" text-anchor="end">web/</text><line class="sep" x1="336" y1="300" x2="636" y2="300"/><text class="lx" x="350" y="318" text-anchor="start">SaleController, SaleExceptionController</text><text class="lx" x="350" y="334" text-anchor="start">request/response DTOs, mappers</text><text class="lx" x="350" y="350" text-anchor="start">HTTP only: validate, check permission</text></g><g class="ly svc"><rect class="" x="336" y="392" width="300" height="108" rx="10"/><text class="lt" x="350" y="414" text-anchor="start">Service</text><text class="lf" x="622" y="414" text-anchor="end">service/</text><line class="sep" x1="336" y1="424" x2="636" y2="424"/><text class="lx" x="350" y="442" text-anchor="start">SaleService, SaleReturnService</text><text class="lx" x="350" y="458" text-anchor="start">all business rules, @Transactional,</text><text class="lx" x="350" y="474" text-anchor="start">audit, events; plain helper classes</text><text class="lx" x="350" y="490" text-anchor="start">e.g. TaxCalculator (shared vectors)</text></g><g class="ly repo"><rect class="" x="336" y="532" width="300" height="88" rx="10"/><text class="lt" x="350" y="554" text-anchor="start">Repository</text><text class="lf" x="622" y="554" text-anchor="end">repository/</text><line class="sep" x1="336" y1="564" x2="636" y2="564"/><text class="lx" x="350" y="582" text-anchor="start">SaleRepository (Spring Data JPA)</text><text class="lx" x="350" y="598" text-anchor="start">SaleQueryRepository (JdbcClient SQL)</text><text class="lx" x="350" y="614" text-anchor="start">database access only</text></g><g class="ly mdl"><rect class="" x="660" y="392" width="130" height="228" rx="10"/><text class="lt" x="674" y="414" text-anchor="start">Model</text><text class="lf" x="776" y="414" text-anchor="end">model/</text><line class="sep" x1="660" y1="424" x2="790" y2="424"/><text class="lx" x="674" y="442" text-anchor="start">Sale</text><text class="lx" x="674" y="458" text-anchor="start">SaleLine</text><text class="lx" x="674" y="474" text-anchor="start">SaleLine-</text><text class="lx" x="674" y="490" text-anchor="start">  Allocation</text><text class="lx" x="674" y="506" text-anchor="start"></text><text class="lx" x="674" y="522" text-anchor="start">Money, Quantity</text><text class="lx" x="674" y="538" text-anchor="start"></text><text class="lx" x="674" y="554" text-anchor="start">entities and</text><text class="lx" x="674" y="570" text-anchor="start">value objects</text></g><g class="db"><path d="M336,694 a150.0,10 0 0 1 300,0 v40 a150.0,10 0 0 1 -300,0 z"/><path class="top" d="M336,694 a150.0,10 0 0 0 300,0"/></g><text class="dbt" x="486.0" y="722" text-anchor="middle">PostgreSQL · sale, sale_line … (RLS on)</text><g class="cl"><rect class="" x="30" y="280" width="220" height="66" rx="33"/><text class="ct" x="140" y="306" text-anchor="middle">ADMIN WEB APP</text><text class="cs" x="140" y="324" text-anchor="middle">REST /api/v1/sales</text></g><g class="cl"><rect class="" x="30" y="136" width="220" height="66" rx="33"/><text class="ct" x="140" y="162" text-anchor="middle">SYNC OR ANOTHER MODULE</text><text class="cs" x="140" y="180" text-anchor="middle">calls SalesApi.recordSale(…)</text></g><g class="ot"><rect class="" x="870" y="400" width="230" height="112" rx="10"/><text class="ot-t" x="884" y="422" text-anchor="start">OTHER MODULES&#x27; APIs</text><text class="lx" x="884" y="446" text-anchor="start">InventoryApi.allocateAndDeduct</text><text class="lx" x="884" y="464" text-anchor="start">TaxApi.issueDocument</text><text class="lx" x="884" y="482" text-anchor="start">PaymentsApi · AuditApi.record</text></g><g class="ot"><rect class="" x="870" y="132" width="230" height="92" rx="10"/><text class="ot-t" x="884" y="154" text-anchor="start">LISTENERS ELSEWHERE</text><text class="lx" x="884" y="176" text-anchor="start">Cash, Customers, Reporting</text><text class="lx" x="884" y="192" text-anchor="start">run after the sale is saved</text><text class="lx" x="884" y="208" text-anchor="start">(outbox, retried)</text></g><path class="e call" d="M250,313 L330,313" marker-end="url(#mls-call)"/><text class="el call" x="292" y="305" text-anchor="middle">HTTP</text><path class="e call" d="M250,169 L312,169" marker-end="url(#mls-call)"/><path class="e call" d="M326,206 L326,446 L330,446" marker-end="url(#mls-call)"/><path class="e call" d="M486.0,360 L486.0,386" marker-end="url(#mls-call)"/><text class="el call" x="494.0" y="378" text-anchor="start">one method call</text><path class="e call" d="M486.0,500 L486.0,526" marker-end="url(#mls-call)"/><path class="e call" d="M486.0,620 L486.0,686" marker-end="url(#mls-call)"/><text class="el call" x="508.0" y="658" text-anchor="middle">SQL</text><path class="e uses" d="M636,440 L656,440"/><path class="e uses" d="M636,576 L656,576"/><path class="e call" d="M636,470 L644,470 L644,640 L840,640 L840,456 L864,456" marker-end="url(#mls-call)"/><text class="el call" x="744" y="632" text-anchor="middle">calls only their Api</text><path class="e event" d="M636,404 L648,404 L648,248 L728,248 L728,212" marker-end="url(#mls-event)"/><text class="el event" x="690" y="242" text-anchor="middle">publishes</text><path class="e event" d="M804,169 L8