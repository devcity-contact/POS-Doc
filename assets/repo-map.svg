</style><defs><marker id="rms-use" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah use" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rms-gen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah gen" d="M0,0 L10,5 L0,10 z"/></marker><marker id="rms-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah back" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1180" height="724"/><g class="b be"><rect x="30" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="51" y="30" text-anchor="start">Backend</text><g class="b pk"><rect x="125.4" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="146.4" y="30" text-anchor="start">Shared packages</text><g class="b ap"><rect x="278.4" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="299.4" y="30" text-anchor="start">Apps</text><g class="b sh"><rect x="352.2" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="373.2" y="30" text-anchor="start">Shared test data</text><g class="b in"><rect x="512.4" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="533.4" y="30" text-anchor="start">Infra and docs</text><g class="b out"><rect x="658.2" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="679.2" y="30" text-anchor="start">What it produces</text><text class="lg2" x="30" y="56" text-anchor="start">Solid arrow: uses or is checked against. Dashed pink arrow: generated from.</text><rect class="frame" x="16" y="72" width="860" height="636" rx="16"/><text class="ft" x="32" y="94" text-anchor="start">RETAILOS · ONE PRIVATE GITHUB REPOSITORY</text><text class="lane" x="902" y="94" text-anchor="start">WHAT IT PRODUCES</text><g class="b sh"><rect x="30" y="110" width="236" height="96" rx="10"/><text class="t" x="42" y="131">shared/test-vectors/</text><line class="sep" x1="30" y1="141" x2="266" y2="141"/><text class="x" x="42" y="158">JSON cases: tax, pricing,</text><text class="x" x="42" y="174">rounding, GS1 parsing;</text><text class="x" x="42" y="190">checked by Java and TS</text></g><g class="b be"><rect x="300" y="110" width="556" height="102" rx="10"/><text class="t" x="312" y="131">backend/</text><line class="sep" x1="300" y1="141" x2="856" y2="141"/><text class="x" x="312" y="158">Spring Boot 4 · Java 25 · Gradle</text><text class="x" x="312" y="174">15 modules, each web → service → repository (ADR-015)</text><text class="x" x="312" y="190">Flyway migrations · unit, Modulith and Testcontainers tests</text></g><g class="b out"><rect x="902" y="140" width="250" height="40" rx="20.0"/><text class="t plain" x="1027.0" y="164.5" text-anchor="middle">Docker image → GHCR</text></g><path class="e use" d="M266,150 L294,150" marker-end="url(#rms-use)"/><path class="e use" d="M856,160 L896,160" marker-end="url(#rms-use)"/><g class="b pk"><rect x="300" y="262" width="250" height="70" rx="10"/><text class="t" x="312" y="283">packages/api-client</text><line class="sep" x1="300" y1="293" x2="550" y2="293"/><text class="x" x="312" y="310">generated from the OpenAPI</text><text class="x" x="312" y="326">used by admin and register</text></g><g class="b pk"><rect x="300" y="346" width="250" height="70" rx="10"/><text class="t" x="312" y="367">packages/register-core</text><line class="sep" x1="300" y1="377" x2="550" y2="377"/><text class="x" x="312" y="394">cart, pricing, tax, sale, shift</text><text class="x" x="312" y="410">pure TypeScript, no UI</text></g><g class="b pk"><rect x="300" y="430" width="250" height="70" rx="10"/><text class="t" x="312" y="451">packages/ui</text><line class="sep" x1="300" y1="461" x2="550" y2="461"/><text class="x" x="312" y="478">shared React components</text><text class="x" x="312" y="494">design tokens, light and dark</text></g><g class="b pk"><rect x="300" y="514" width="250" height="54" rx="10"/><text class="t" x="312" y="535">packages/i18n</text><line class="sep" x1="300" y1="545" x2="550" y2="545"/><text class="x" x="312" y="562">English · Sinhala · Tamil</text></g><path class="e gen" d="M425,212 L425,256" marker-end="url(#rms-gen)"/><text class="el gen" x="436" y="240" text-anchor="start">OpenAPI → client</text><path class="e use" d="M148,206 L148,381 L294,381" marker-end="url(#rms-use)"/><text class="el use" x="156" y="300" text-anchor="start">same cases</text><g class="b ap"><rect x="590" y="262" width="250" height="72" rx="10"/><text class="t" x="602" y="283">apps/admin</text><line class="sep" x1="590" y1="293" x2="840" y2="293"/><text class="x" x="602" y="310">React back-office web app</text><text class="x" x="602" y="326">Vite · TanStack · Tailwind</text></g><g class="b ap"><rect x="590" y="362" width="250" height="72" rx="10"/><text class="t" x="602" y="383">apps/register</text><line class="sep" x1="590" y1="393" x2="840" y2="393"/><text class="x" x="602" y="410">React register UI</text><text class="x" x="602" y="426">one UI for both shells</text></g><g class="b ap"><rect x="590" y="466" width="250" height="62" rx="10"/><text class="t" x="602" y="487">apps/register-electron</text><line class="sep" x1="590" y1="497" x2="840" y2="497"/><text class="x" x="602" y="514">Windows shell · SQLCipher</text></g><g class="b ap"><rect x="590" y="552" width="250" height="62" rx="10"/><text class="t" x="602" y="573">apps/register-android</text><line class="sep" x1="590" y1="583" x2="840" y2="583"/><text class="x" x="602" y="600">Android shell · Kotlin plugin</text></g><path class="e use" d="M550,297 L584,297" marker-end="url(#rms-use)"/><path class="e use" d="M550,381 L584,397" marker-end="url(#rms-use)"/><text class="lg2" x="300" y="596" text-anchor="start">ui and i18n are used by both apps</text><path class="e use" d="M840,398 L858,398 L858,486 L846,486" marker-end="url(#rms-use)"/><path class="e use" d="M858,486 L858,572 L846,572" marker-end="url(#rms-use)"/><text class="el" x="866" y="440" text-anchor="start">wrapped by</text><g class="b out"><rect x="902" y="278" width="250" height="40" rx="20.0"/><text class="t plain" x="1027.0" y="302.5" text-anchor="middle">Static site → CDN</text></g><g class="b out"><rect x="902" y="488" width="250" height="40" rx="20.0"/><text class="t plain" x="1027.0" y="512.5" text-anchor="middle">Signed Windows installer</text></g><g class="b out"><rect x="902" y="574" width="250" height="40" rx="20.0"/><text class="t plain" x="1027.0" y="598.5" text-anchor="middle">AAB / APK → Play or MDM</text></g><path class="e use" d="M840,298 L896,298" marker-end="url(#rms-use)"/><path class="e use" d="M840,508 L896,508" marker-end="url(#rms-use)"/><path class="e use" d="M840,594 L896,594" marker-end="url(#rms-use)"/><g class="b in"><rect x="30" y="430" width="236" height="84" rx="10"/><text class="t" x="42" y="451">infra/</text><line class="sep" x1="30" y1="461" x2="266" y2="461"/><text class="x" x="42" y="478">docker compose, Caddy,</text><text class="x" x="42" y="494">CI scripts, deploy scripts</text></g><g class="b in"><rect x="30" y="540" width="236" height="70" rx="10"/><text class="t" x="42" y="561">docs/</text><line class="sep" x1="30" y1="571" x2="266" y2="571"/><text class="x" x="42" y="588">this documentation site</text><text class="x" x="42" y="604">(see the open decision)</text></g><g class="b out"><rect x="30" y="640" width="236" height="40" rx="20.0"/><text class="t plain" x="148.0" y="664.5" text-anchor="middle">Docs site</text></g><path class="e use" d="M148,610 L148,634" marker-end="url(#rms-use)"/></svg>