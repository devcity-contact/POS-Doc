.rpo .lane{font-size:12px;font-weight:800;letter-spacing:.08em;fill:var(--tx2)}
.rpo .e{fill:none;stroke-width:1.6} .rpo .e.use{stroke:var(--ln)} .rpo .e.gen{stroke:var(--gen);stroke-dasharray:6 4} .rpo .e.back{stroke:var(--rl);stroke-dasharray:6 4}
.rpo .ah.use{fill:var(--ln)} .rpo .ah.gen{fill:var(--gen)} .rpo .ah.back{fill:var(--rl)}
.rpo .el{font-size:11.5px;font-weight:600;paint-order:stroke;stroke:var(--bgc);stroke-width:5px;stroke-linejoin:round;fill:var(--tx)} .rpo .el.gen{fill:var(--gen)} .rpo .el.back{fill:var(--rl)}
.rpo .lg{font-size:12.5px;fill:var(--tx);font-weight:600} .rpo .lg2{font-size:12.5px;fill:var(--tx2)}
:root[data-theme="dark"] .rpo{--be:#7FA8FF;--be-bg:#1B2840;--pk:#FF9D6B;--pk-bg:#382218;--ap:#B99BFF;--ap-bg:#251C3A;--sh:#5BD49A;--sh-bg:#142D24;
 --in:#A3ABBB;--in-bg:#2A2D37;--out:#4FC9D2;--out-bg:#12292C;--me:#A3ABBB;--me-bg:#2A2D37;--gh:#7FA8FF;--gh-bg:#1B2840;--ci:#B99BFF;--ci-bg:#251C3A;
 --st:#5BD49A;--st-bg:#142D24;--rl:#FF9D6B;--rl-bg:#382218;--ln:#A3ABBB;--gen:#F28AC8;--frame:#B4C0DE;--bgc:#272932}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rpo{--be:#7FA8FF;--be-bg:#1B2840;--pk:#FF9D6B;--pk-bg:#382218;--ap:#B99BFF;--ap-bg:#251C3A;--sh:#5BD49A;--sh-bg:#142D24;
 --in:#A3ABBB;--in-bg:#2A2D37;--out:#4FC9D2;--out-bg:#12292C;--me:#A3ABBB;--me-bg:#2A2D37;--gh:#7FA8FF;--gh-bg:#1B2840;--ci:#B99BFF;--ci-bg:#251C3A;
 --st:#5BD49A;--st-bg:#142D24;--rl:#FF9D6B;--rl-bg:#382218;--ln:#A3ABBB;--gen:#F28AC8;--frame:#B4C0DE;--bgc:#272932}}

.rpo .bg{fill:#FDFFFC}
@media (prefers-color-scheme:dark){.rpo{--be:#7FA8FF;--be-bg:#1B2840;--pk:#FF9D6B;--pk-bg:#382218;--ap:#B99BFF;--ap-bg:#251C3A;--sh:#5BD49A;--sh-bg:#142D24;
 --in:#A3ABBB;--in-bg:#2A2D37;--out:#4FC9D2;--out-bg:#12292C;--me:#A3ABBB;--me-bg:#2A2D37;--gh:#7FA8FF;--gh-bg:#1B2840;--ci:#B99BFF;--ci-bg:#251C3A;
 --st:#5BD49A;--st-bg:#142D24;--rl:#FF9D6B;--rl-bg:#382218;--ln:#A3ABBB;--gen:#F28AC8;--frame:#B4C0DE;--bgc:#1E2028;--tx:#E6E9EF;--tx2:#9AA3B5}.rpo .bg{fill:#1E2028}}
</style><defs><marker id="gfs-use" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah use" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gfs-gen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah gen" d="M0,0 L10,5 L0,10 z"/></marker><marker id="gfs-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah back" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1180" height="520"/><g class="b me"><rect x="30" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="51" y="30" text-anchor="start">On your computer</text><g class="b gh"><rect x="190.2" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="211.2" y="30" text-anchor="start">GitHub</text><g class="b ci"><rect x="278.4" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="299.4" y="30" text-anchor="start">GitHub Actions</text><g class="b st"><rect x="424.2" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="445.2" y="30" text-anchor="start">Staging</text><g class="b rl"><rect x="519.6" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="540.6" y="30" text-anchor="start">Release</text><g class="b me"><rect x="30" y="92" width="196" height="126" rx="10"/><text class="t plain" x="42" y="113">1 · BRANCH</text><line class="sep" x1="30" y1="123" x2="226" y2="123"/><text class="x code" x="42" y="140">git switch -c</text><text class="x code" x="42" y="156">feat/AUTN-09-refresh</text><text class="x" x="42" y="172">small: merged in days</text><text class="x code" x="42" y="188">feat(iam): rotate …</text></g><g class="b gh"><rect x="260" y="92" width="196" height="126" rx="10"/><text class="t plain" x="272" y="113">2 · PULL REQUEST</text><line class="sep" x1="260" y1="123" x2="456" y2="123"/><text class="x code" x="272" y="140">gh pr create --fill</text><text class="x" x="272" y="156">template + checklist</text><text class="x" x="272" y="172">links the task ID</text><text class="x" x="272" y="188">self-review, AI review</text></g><g class="b ci"><rect x="490" y="92" width="196" height="206" rx="10"/><text class="t plain" x="502" y="113">3 · CI CHECKS</text><line class="sep" x1="490" y1="123" x2="686" y2="123"/><text class="x" x="502" y="140">only what changed:</text><text class="x" x="502" y="156">backend: tests, boundary,</text><text class="x" x="502" y="172">  ArchUnit, OpenAPI diff</text><text class="x" x="502" y="188">admin: build and tests</text><text class="x" x="502" y="204">register: core tests,</text><text class="x" x="502" y="220">  Windows + Android build</text><text class="x" x="502" y="236">docs: rebuild, link check</text><text class="x" x="502" y="252">always: scans and lint</text></g><g class="b gh"><rect x="720" y="92" width="196" height="126" rx="10"/><text class="t plain" x="732" y="113">4 · SQUASH MERGE</text><line class="sep" x1="720" y1="123" x2="916" y2="123"/><text class="x" x="732" y="140">all checks green</text><text class="x" x="732" y="156">one commit on main</text><text class="x" x="732" y="172">branch deleted</text><text class="x" x="732" y="188">main stays deployable</text></g><g class="b st"><rect x="950" y="92" width="196" height="126" rx="10"/><text class="t plain" x="962" y="113">5 · STAGING</text><line class="sep" x1="950" y1="123" x2="1146" y2="123"/><text class="x" x="962" y="140">main deploys itself</text><text class="x" x="962" y="156">migrations run first</text><text class="x" x="962" y="172">Try it steps checked</text><text class="x" x="962" y="188">demo data can be reset</text></g><path class="e use" d="M226,132 L254,132" marker-end="url(#gfs-use)"/><path class="e use" d="M456,132 L484,132" marker-end="url(#gfs-use)"/><path class="e use" d="M686,132 L714,132" marker-end="url(#gfs-use)"/><path class="e use" d="M916,132 L944,132" marker-end="url(#gfs-use)"/><path class="e back" d="M530,298 L530,328 L358.0,328 L358.0,224" marker-end="url(#gfs-back)"/><text class="el back" x="370.0" y="322" text-anchor="start">a check fails: fix it, push again</text><path class="e use" d="M1048.0,218 L1048.0,362 L128.0,362 L128.0,386" marker-end="url(#gfs-use)"/><text class="el use" x="730" y="356" text-anchor="start">when a version is ready to ship</text><g class="b rl"><rect x="30" y="392" width="196" height="110" rx="10"/><text class="t plain" x="42" y="413">6 · TAG A RELEASE</text><line class="sep" x1="30" y1="423" x2="226" y2="423"/><text class="x code" x="42" y="440">backend-v1.4.0</text><text class="x code" x="42" y="456">register-v1.6.0</text><text class="x code" x="42" y="472">admin-v1.3.0</text></g><g class="b rl"><rect x="260" y="392" width="426" height="110" rx="10"/><text class="t plain" x="272" y="413">7 · RELEASE BUILD (from the tag)</text><line class="sep" x1="260" y1="423" x2="686" y2="423"/><text class="x" x="272" y="440">backend: Docker image · admin: static site</text><text class="x" x="272" y="456">register: signed Windows installer, signed AAB/APK</text><text class="x" x="272" y="472">release notes from the commit messages</text></g><g class="b rl"><rect x="720" y="392" width="426" height="110" rx="10"/><text class="t plain" x="732" y="413">8 · PRODUCTION AND SHOPS</text><line class="sep" x1="720" y1="423" x2="1146" y2="423"/><text class="x" x="732" y="440">backend: manual approval, health-gated deploy</text><text class="x" x="732" y="456">Windows: auto-update, staged roll-out</text><text class="x" x="732" y="472">Android: Play staged roll-out, or MDM</text></g><path class="e use" d="M226,432 L254,432" marker-end="url(#gfs-use)"/><path class="e use" d="M686,432 L714,432" marker-end="url(#gfs-use)"/></svg>