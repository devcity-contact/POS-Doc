</style><defs><marker id="bcrs-use" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah use" d="M0,0 L10,5 L0,10 z"/></marker><marker id="bcrs-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ok" d="M0,0 L10,5 L0,10 z"/></marker><marker id="bcrs-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah no" d="M0,0 L10,5 L0,10 z"/></marker><marker id="bcrs-ev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah ev" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bg" width="1180" height="420"/><g class="b be"><rect x="30" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="51" y="30" text-anchor="start">Code inside a module</text><g class="b st"><rect x="219.0" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="240.0" y="30" text-anchor="start">Another module&#x27;s Api: same transaction</text><g class="b ap"><rect x="537.6" y="19" width="14" height="14" rx="3"/></g><text class="lg" x="558.6" y="30" text-anchor="start">An event: handled after commit</text><text class="lg2" x="30" y="56" text-anchor="start">Arrows show the flow of a call or an event. Both paths only touch public parts.</text><g class="b be"><rect x="30" y="110" width="260" height="118" rx="10"/><text class="t" x="42" y="131">sales · SaleService</text><line class="sep" x1="30" y1="141" x2="290" y2="141"/><text class="x" x="42" y="158">recordSale(…)</text><text class="x" x="42" y="174">@Transactional:</text><text class="x" x="42" y="190">one database transaction</text><text class="x" x="42" y="206">for stock, tax and the sale</text></g><g class="b st"><rect x="470" y="76" width="330" height="62" rx="10"/><text class="t" x="482" y="97">inventory · InventoryApi</text><line class="sep" x1="470" y1="107" x2="800" y2="107"/><text class="x" x="482" y="124">allocateAndDeduct(…): stock leaves now</text></g><g class="b st"><rect x="470" y="150" width="330" height="62" rx="10"/><text class="t" x="482" y="171">tax · TaxApi</text><line class="sep" x1="470" y1="181" x2="800" y2="181"/><text class="x" x="482" y="198">issueDocument(…): tax invoice number now</text></g><path class="e ok" d="M290,140 L380,140 L380,107 L464,107" marker-end="url(#bcrs-ok)"/><path class="e ok" d="M290,181 L464,181" marker-end="url(#bcrs-ok)"/><text class="el ok" x="300" y="172" text-anchor="start">needs the answer now</text><g class="b ap"><rect x="470" y="262" width="330" height="62" rx="10"/><text class="t" x="482" y="283">sales/events · SaleCompleted</text><line class="sep" x1="470" y1="293" x2="800" y2="293"/><text class="x" x="482" y="310">published inside the transaction</text></g><path class="e ev" d="M160,228 L160,293 L464,293" marker-end="url(#bcrs-ev)"/><text class="el ev" x="172" y="282" text-anchor="start">publishes</text><g class="b be"><rect x="900" y="206" width="260" height="78" rx="10"/><text class="t" x="912" y="227">customers · listener</text><line class="sep" x1="900" y1="237" x2="1160" y2="237"/><text class="x" x="912" y="254">@ApplicationModuleListener</text><text class="x" x="912" y="270">updates visit stats</text></g><g class="b be"><rect x="900" y="300" width="260" height="78" rx="10"/><text class="t" x="912" y="321">reporting · listener</text><line class="sep" x1="900" y1="331" x2="1160" y2="331"/><text class="x" x="912" y="348">@ApplicationModuleListener</text><text class="x" x="912" y="364">updates daily totals</text></g><path class="e ev" d="M800,293 L840,293 L840,245 L894,245" marker-end="url(#bcrs-ev)"/><path class="e ev" d="M840,293 L840,339 L894,339" marker-end="url(#bcrs-ev)"/><text class="el ev" x="845" y="404" text-anchor="middle">after commit; retried until handled (outbox)</text></svg>